services:
  - type: web
    name: second-brain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn director:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DIRECTOR_TOKEN
        sync: false
